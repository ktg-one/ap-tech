<html lang="en">

  <link rel="modulepreload" href="https://esm.sh/lenis@1.1.20">

  <style>
    /* ─── DESIGN TOKENS ─────────────────────────────────────────── */
    :root {
      --teal:        #2dd4bf;
      --blue:        #3b82f6;
      --bg:          #020617;
      --teal-glow:   rgba(45,212,191,.40);
      --blue-glow:   rgba(59,130,246,.40);
      --teal-dim:    rgba(45,212,191,.12);
      --blue-dim:    rgba(59,130,246,.12);
      --surface-1:   #0f172a;
      --surface-2:   #1e293b;
      --shadow-sm:   0 1px 3px rgba(0,0,0,.40);
      --shadow-md:   0 4px 16px rgba(0,0,0,.50);
      --shadow-lg:   0 8px 32px rgba(0,0,0,.60);
      --shadow-teal: 0 0 24px rgba(45,212,191,.18), 0 0 8px rgba(45,212,191,.10);
      --shadow-blue: 0 0 24px rgba(59,130,246,.18), 0 0 8px rgba(59,130,246,.10);
    }

    /* ─── BASE ──────────────────────────────────────────────────── */
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    html, body { background-color: var(--bg); }
    body { font-family: 'Satoshi', system-ui, sans-serif; overflow-x: hidden; }
    h1,h2,h3,h4,h5,h6,.logo-text { font-family: 'Outfit', sans-serif; letter-spacing: -.025em; }
    h1 { letter-spacing: -.04em; line-height: 1; }
    .font-mono, code { font-family: 'JetBrains Mono', monospace; }
    ::selection { background: rgba(45,212,191,.25); color: #e2e8f0; }
    :focus-visible { outline: 2px solid rgba(45,212,191,.70); outline-offset: 3px; }

    /* ─── LENIS SMOOTH SCROLL ───────────────────────────────────── */
    html.lenis { height: auto; }
    html.lenis.lenis-smooth { scroll-behavior: auto !important; }
    html.lenis.lenis-stopped { overflow: hidden; }

    /* ─── PRELOADER ─────────────────────────────────────────────── */
    #preloader {
      position: fixed; inset: 0; z-index: 9998;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      transition: opacity .8s cubic-bezier(.65,0,.35,1), visibility .8s;
    }
    #preloader.done { opacity: 0; visibility: hidden; pointer-events: none; }
    #preloader .pl-inner {
      display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
    }
    #preloader .pl-logo {
      height: 4rem; width: auto; object-fit: contain;
      opacity: 0; animation: plFade .6s .1s cubic-bezier(.16,1,.3,1) forwards;
    }
    #preloader .pl-mark {
      font-family: 'Outfit', sans-serif; font-weight: 900;
      font-size: clamp(3rem,9vw,6rem); letter-spacing: -.06em;
      color: #fff; line-height: 1;
      display: flex; align-items: baseline; gap: .4rem;
      opacity: 0; animation: plFade .6s .1s cubic-bezier(.16,1,.3,1) forwards;
    }
    #preloader .pl-dot {
      width: .55em; height: .55em; border-radius: 999px;
      background: linear-gradient(135deg,var(--teal),var(--blue));
      transform: translateY(-.05em);
      animation: plPulse 1.4s ease-in-out infinite;
    }
    #preloader .pl-bar {
      position: absolute; bottom: 0; left: 0; height: 2px;
      background: linear-gradient(90deg,var(--teal),var(--blue));
      width: 0%; animation: plProg 1.6s .2s cubic-bezier(.65,0,.35,1) forwards;
    }
    @keyframes plFade  { to { opacity: 1; } }
    @keyframes plPulse { 0%,100%{opacity:1;transform:translateY(-.05em) scale(1)}50%{opacity:.5;transform:translateY(-.05em) scale(.85)} }
    @keyframes plProg  { to { width: 100%; } }

    /* ─── AURORA BACKGROUND ─────────────────────────────────────── */
    .aurora { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .aurora::before, .aurora::after {
      content: ''; position: absolute; border-radius: 50%; filter: blur(80px); opacity: .35;
    }
    .aurora::before {
      width: 60vw; height: 60vw; left: -20vw; top: -20vw;
      background: radial-gradient(circle, rgba(45,212,191,.25), transparent 60%);
      animation: auroraDrift 22s ease-in-out infinite alternate;
    }
    .aurora::after {
      width: 70vw; height: 70vw; right: -25vw; bottom: -30vw;
      background: radial-gradient(circle, rgba(59,130,246,.22), transparent 60%);
      animation: auroraDrift 28s ease-in-out -8s infinite alternate-reverse;
    }
    @keyframes auroraDrift {
      0%   { transform: translate(0,0) scale(1); }
      50%  { transform: translate(8vw,6vh) scale(1.1); }
      100% { transform: translate(-6vw,-4vh) scale(.95); }
    }

    /* ─── GRAIN OVERLAY ─────────────────────────────────────────── */
    .grain-overlay {
      position: fixed; inset: 0; z-index: 9997; pointer-events: none;
      opacity: .06; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ─── GRID PATTERN ──────────────────────────────────────────── */
    .bg-grid-pattern {
      background-size: 40px 40px;
      background-image:
        linear-gradient(to right,  rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.03) 1px, transparent 1px);
    }

    /* ─── SCROLLBAR ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 0; background: transparent; }
    .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* ─── SCROLL PROGRESS ───────────────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }
    .scroll-prog {
      position: fixed; top: 0; left: 0; height: 2px; width: 0;
      background: linear-gradient(90deg, var(--teal), var(--blue), var(--teal));
      background-size: 200% auto;
      animation: shimmer 3s linear infinite;
      z-index: 100; transform-origin: left;
      box-shadow: 0 0 14px rgba(45,212,191,.65);
    }

    /* ─── SECTION DOT NAV ───────────────────────────────────────── */
    .section-dots {
      position: fixed; right: 1.5rem; top: 50%; transform: translateY(-50%);
      z-index: 40; display: none; flex-direction: column; gap: .85rem;
    }
    @media (min-width: 1024px) { .section-dots { display: flex; } }
    .section-dots a {
      position: relative; width: 8px; height: 8px; border-radius: 999px;
      background: rgba(148,163,184,.3); transition: all .3s ease;
    }
    .section-dots a::before {
      content: attr(data-label); position: absolute; right: 18px; top: 50%;
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500;
      color: rgba(148,163,184,.6); white-space: nowrap; letter-spacing: .1em;
      text-transform: uppercase; opacity: 0;
      transition: opacity .25s ease, transform .25s ease;
      transform: translate(8px,-50%); pointer-events: none;
    }
    .section-dots a:hover { background: var(--teal); transform: scale(1.4); }
    .section-dots a:hover::before { opacity: 1; transform: translate(0,-50%); }
    .section-dots a.is-active { background: var(--teal); box-shadow: 0 0 12px var(--teal); transform: scale(1.3); }

    /* ─── NAV ───────────────────────────────────────────────────── */
    nav.sticky, nav[class*="sticky"] {
      backdrop-filter: blur(28px) saturate(200%) !important;
      -webkit-backdrop-filter: blur(28px) saturate(200%) !important;
      box-shadow: 0 1px 0 rgba(45,212,191,.07), 0 4px 32px rgba(0,0,0,.55) !important;
    }
    .nav-logo-img {
      height: 2.2rem; width: auto; object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(45,212,191,.35));
    }

    /* ─── REVEAL ANIMATIONS ─────────────────────────────────────── */
    [data-reveal] { opacity: 0; transform: translateY(40px); will-change: opacity, transform; }
    [data-reveal-stagger] > * { opacity: 0; transform: translateY(30px); }
    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateX(24px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .slide-fade-in { animation: slideFadeIn .45s cubic-bezier(.16,1,.3,1) both; }

    /* ─── METRIC CARD ───────────────────────────────────────────── */
    .metric-card {
      position: relative;
      transition: transform .4s cubic-bezier(.16,1,.3,1),
                  border-color .35s ease, box-shadow .35s ease;
    }
    .metric-card::before {
      content: ''; position: absolute; inset: -1px; border-radius: inherit;
      background: linear-gradient(135deg, rgba(45,212,191,.45) 0%, transparent 45%, rgba(59,130,246,.30) 100%);
      opacity: 0; transition: opacity .45s ease; z-index: -1; pointer-events: none;
    }
    .metric-card::after {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(45,212,191,.7), transparent);
      opacity: 0; transition: opacity .4s ease;
    }
    .metric-card:hover::before { opacity: 1; }
    .metric-card:hover::after  { opacity: 1; }
    .metric-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 0 1px rgba(45,212,191,.30), var(--shadow-lg), var(--shadow-teal);
    }

    /* ─── CARD UTILITIES ────────────────────────────────────────── */
    .ap-card-hover { transition: transform .5s cubic-bezier(.16,1,.3,1), border-color .4s ease, box-shadow .4s ease; }
    .ap-card-hover:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(45,212,191,.12); }

    /* ─── HERO CHIP ─────────────────────────────────────────────── */
    [data-anim="hero-chip"] { transition: all .3s cubic-bezier(.16,1,.3,1) !important; }
    [data-anim="hero-chip"]:hover {
      border-color: rgba(45,212,191,.45) !important;
      background: rgba(15,23,42,.92) !important;
      box-shadow: 0 0 14px rgba(45,212,191,.12), var(--shadow-md) !important;
      transform: translateY(-2px);
    }

    /* ─── H2 UNDERLINE REVEAL ───────────────────────────────────── */
    main section h2 { position: relative; }
    main section h2[data-h2-line]::after {
      content: ''; position: absolute; left: 0; bottom: -8px; height: 2px; width: 100%;
      background: linear-gradient(90deg, var(--teal), var(--blue), transparent 70%);
      transform: scaleX(0); transform-origin: left;
      transition: transform .9s cubic-bezier(.16,1,.3,1);
    }
    main section h2[data-h2-line].is-in::after { transform: scaleX(1); }

    /* ─── SLIDE IMAGES ──────────────────────────────────────────── */
    .slide-img-frame {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #020617;
    }
    .slide-img-frame img { width: 100%; height: 100%; object-fit: contain; }

    /* ─── SECTION BADGE PILL ────────────────────────────────────── */
    .ap-badge {
      display: inline-flex; align-items: center; gap: .375rem;
      padding: .2rem .75rem; border-radius: 9999px;
      background: rgba(45,212,191,.06); border: 1px solid rgba(45,212,191,.18);
      color: var(--teal); font-family: 'JetBrains Mono', monospace;
      font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .14em;
    }

    /* ─── WAVE ANIMATION ────────────────────────────────────────── */
    .wave-bar { transition: height .18s cubic-bezier(.16,1,.3,1); }
    [data-wave][data-playing="1"] .wave-bar { animation: waveBeat .9s ease-in-out infinite; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(2n)   { animation-delay: .12s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(3n)   { animation-delay: .24s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(4n)   { animation-delay: .08s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(5n)   { animation-delay: .32s; }
    [data-wave] .wave-bar { transform-origin: bottom; }
    @keyframes waveBeat { 0%,100%{transform:scaleY(.45)} 50%{transform:scaleY(1.25)} }

    /* ─── CAROUSEL CONTROLS ─────────────────────────────────────── */
    [data-slide-prev], [data-slide-next] { transition: all .3s cubic-bezier(.16,1,.3,1) !important; }
    [data-slide-prev]:hover:not(:disabled),
    [data-slide-next]:hover:not(:disabled) {
      box-shadow: 0 0 16px rgba(45,212,191,.25) !important;
      border-color: rgba(45,212,191,.40) !important;
    }

    /* ─── FOOTER ────────────────────────────────────────────────── */
    footer { position: relative; }
    footer::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(45,212,191,.28), rgba(59,130,246,.22), transparent);
    }

    /* ─── REDUCED MOTION ────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; animation-iteration-count: 1 !important; }
      .aurora::before, .aurora::after { animation: none !important; }
      [data-reveal], [data-reveal-stagger] > * { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>

  <!-- ── Preloader ───────────────────────────────────────────────── -->
  <!-- Shows your logo (assets/logo.png) while the app bootstraps.   -->
  <!-- Falls back to PORTAL_CONFIG.brand.abbreviation text.          -->
  <div id="preloader">
    <div class="pl-inner">
      <img src="assets/logo.png" alt="Logo" class="pl-logo"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">

        <span id="pl-abbr">AP</span><span class="pl-dot"></span>

    <div class="pl-bar"></div>
  </div>

  <script>
    // Defensive failsafe: hide preloader after 2 s even if React fails.
    setTimeout(function() {
      var pl = document.getElementById('preloader');
      if (pl && !pl.classList.contains('done')) pl.classList.add('done');
    }, 2000);
    window.addEventListener('error', function(e) {
      console.error('[portal] runtime error:', e.error || e.message);
    });
  </script>

// ── usePortalAnimations — GSAP + Lenis setup ────────────────────────
function usePortalAnimations(cfg) {
  useEffect(() => {
    const lenis = new Lenis({ lerp: 0.1, duration: 1.15, smoothWheel: true });
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(t => lenis.raf(t * 1000));
    gsap.ticker.lagSmoothing(0);

    // Preloader
    const pl = document.getElementById('preloader');
    const plT = setTimeout(() => pl && pl.classList.add('done'), 1400);

    // Scroll progress
    const prog = document.getElementById('scrollProg');
    const progST = ScrollTrigger.create({
      start: 0, end: 'max',
      onUpdate: self => { if (prog) prog.style.width = self.progress * 100 + '%'; },
    });

    // Section dot nav
    const dotNav = document.getElementById('sectionDots');
    const sections = Array.from(document.querySelectorAll('main section[id]'));
    const dotMap = Object.create(null);
    if (dotNav) {
      dotNav.innerHTML = '';
      sections.forEach(s => {
        const a = document.createElement('a');
        a.href = '#' + s.id;
        a.setAttribute('data-label', s.id.replace(/-/g, ' '));
        a.addEventListener('click', e => { e.preventDefault(); lenis.scrollTo('#' + s.id, { offset: -80 }); });
        dotNav.appendChild(a);
        dotMap[s.id] = a;
      });
    }

    // Section dot active state
    sections.forEach(sec => ScrollTrigger.create({
      trigger: sec, start: 'top 55%', end: 'bottom 55%',
      onToggle: self => {
        const dot = dotMap[sec.id];
        if (dot) dot.classList.toggle('is-active', self.isActive);
      },
    }));

    // Reveal animations
    document.querySelectorAll('[data-reveal]').forEach(el => {
      gsap.fromTo(el, { opacity: 0, y: 40 }, {
        opacity: 1, y: 0, duration: 1, ease: 'apEase',
        scrollTrigger: { trigger: el, start: 'top 88%', toggleActions: 'play none none none' },
      });
    });
    document.querySelectorAll('[data-reveal-stagger]').forEach(wrap => {
      gsap.fromTo(wrap.children, { opacity: 0, y: 30 }, {
        opacity: 1, y: 0, duration: 0.8, ease: 'apEase', stagger: 0.1,
        scrollTrigger: { trigger: wrap, start: 'top 88%', toggleActions: 'play none none none' },
      });
    });

    // H2 underline reveal
    document.querySelectorAll('main section h2[data-h2-line]').forEach(h2 => {
      ScrollTrigger.create({
        trigger: h2, start: 'top 85%',
        onEnter: () => h2.classList.add('is-in'),
      });
    });

    // Animated metric counters
    document.querySelectorAll('[data-counter]').forEach(el => {
      const target   = parseFloat(el.dataset.target   || 0);
      const decimals = parseInt(el.dataset.decimals   || 0, 10);
      const prefix   = el.dataset.prefix   || '';
      const suffix   = el.dataset.suffix   || '';
      ScrollTrigger.create({
        trigger: el, start: 'top 88%', once: true,
        onEnter: () => {
          gsap.fromTo({ val: 0 }, { val: target, duration: 2.2, ease: 'power2.out',
            onUpdate: function() { el.textContent = prefix + this.targets()[0].val.toFixed(decimals) + suffix; }
          });
        },
      });
    });

    return () => {
      clearTimeout(plT);
      progST.kill();
      lenis.destroy();
      ScrollTrigger.getAll().forEach(t => t.kill());
      gsap.ticker.remove(t => lenis.raf(t * 1000));
    };
  }, []);
}

              src: 'assets/logo.png', alt: brand.name + ' logo',
              className: 'nav-logo-img',
              onError: function(e) {
                e.target.style.display = 'none';
                const fb = e.target.nextSibling;
                if (fb) fb.style.display = 'inline-flex';
              }
            }),
            React.createElement(Activity, { className: 'h-6 w-6 text-teal-400', style: { display: 'none' } }),
            React.createElement('span', { className: 'logo-text text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-blue-500 tracking-wider' }, brand.name),
            React.createElement('span', { className: 'text-xs font-semibold text-slate-500 uppercase tracking-widest border-l border-slate-700 pl-2 ml-1' }, brand.tagline)
          ),
          // Desktop nav links
          React.createElement('div', { className: 'hidden md:flex items-center space-x-1' },
            navLinks.map(link => React.createElement('button', {
              key: link.id, onClick: () => scrollTo(link.id),
              className: 'px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800/60 transition-colors uppercase tracking-wider'
            }, link.label))
          ),
          // Mobile hamburger
          React.createElement('button', {
            onClick: () => setMenuOpen(!menuOpen),
            className: 'md:hidden p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/60 transition-colors'
          }, menuOpen ? React.createElement(X, { className: 'w-5 h-5' }) : React.createElement(Menu, { className: 'w-5 h-5' }))
        ),
        // Mobile menu
        menuOpen && React.createElement('div', { className: 'md:hidden border-t border-slate-800/60 py-3 space-y-1' },
          navLinks.map(link => React.createElement('button', {
            key: link.id, onClick: () => scrollTo(link.id),
            className: 'w-full text-left px-4 py-2 text-sm font-semibold text-slate-400 hover:text-white hover:bg-slate-800/60 rounded-lg transition-colors uppercase tracking-wider'
          }, link.label))
        )
      )
    ),

    // ── Main content ───────────────────────────────────────────────
    React.createElement('main', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 space-y-0' },
      React.createElement(OverviewSection,    { cfg: PORTAL_CONFIG }),
      React.createElement(SectionDivider),
      React.createElement(PitchDeckSection,   { cfg: PORTAL_CONFIG }),
      React.createElement(SectionDivider),
      React.createElement(CapabilitiesSection,{ cfg: PORTAL_CONFIG }),
      React.createElement(SectionDivider),
      React.createElement(FootprintSection,   { cfg: PORTAL_CONFIG }),
      React.createElement(SectionDivider),
      React.createElement(StrategySection,    { cfg: PORTAL_CONFIG }),
      React.createElement(SectionDivider),
      React.createElement(BriefingSection,    { cfg: PORTAL_CONFIG }),
      React.createElement(SectionDivider),
      React.createElement(EcosystemSection,   { cfg: PORTAL_CONFIG })
    ),

    // ── Footer ─────────────────────────────────────────────────────
    React.createElement('footer', { className: 'border-t border-slate-800 mt-20 py-10 text-center text-slate-500 text-sm' },
      React.createElement('div', { className: 'max-w-7xl mx-auto px-4' },
        React.createElement('p', null, footer.text)
      )
    )
  );
};

createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
