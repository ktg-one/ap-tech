<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Technologies | Strategic Blueprint</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- ESM Import Map for React, Lucide, GSAP, Lenis -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "gsap": "https://esm.sh/gsap@3.13.0",
        "gsap/ScrollTrigger": "https://esm.sh/gsap@3.13.0/ScrollTrigger",
        "gsap/SplitText": "https://esm.sh/gsap@3.13.0/SplitText",
        "gsap/ScrambleTextPlugin": "https://esm.sh/gsap@3.13.0/ScrambleTextPlugin",
        "gsap/Observer": "https://esm.sh/gsap@3.13.0/Observer",
        "gsap/CustomEase": "https://esm.sh/gsap@3.13.0/CustomEase",
        "lenis": "https://esm.sh/lenis@1.1.20"
      }
    }
  </script>

  <style>
    :root {
      --teal: #2dd4bf;
      --blue: #3b82f6;
      --bg: #020617;
    }
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    html, body { background-color: var(--bg); }
    body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
    h1, h2, h3, h4, h5, h6, .logo-text { font-family: 'Outfit', sans-serif; letter-spacing: -0.02em; }
    h1 { letter-spacing: -0.035em; }
    .font-mono, code, kbd { font-family: 'JetBrains Mono', monospace; }
    /* Lenis is enabled via JS — disable native smooth scroll so it doesn't double up */
    html.lenis { height: auto; }
    html.lenis.lenis-smooth { scroll-behavior: auto !important; }
    html.lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
    html.lenis.lenis-stopped { overflow: hidden; }
    html.lenis.lenis-scrolling iframe { pointer-events: none; }

    .bg-grid-pattern {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 1); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 1); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(71, 85, 105, 1); }

    ::-webkit-scrollbar { width: 0; background: transparent; }
    ::selection { background: rgba(45, 212, 191, 0.35); color: #fff; }

    /* ─── PRELOADER ──────────────────────────── */
    #preloader {
      position: fixed; inset: 0; z-index: 9998;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.8s cubic-bezier(0.65, 0, 0.35, 1), visibility 0.8s;
    }
    #preloader.done { opacity: 0; visibility: hidden; pointer-events: none; }
    #preloader .pl-mark {
      font-family: 'Outfit', sans-serif; font-weight: 900;
      font-size: clamp(3rem, 9vw, 7rem); letter-spacing: -0.06em;
      color: #fff; line-height: 1;
      display: flex; align-items: baseline; gap: 0.5rem;
      opacity: 0; animation: plFade 0.6s 0.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #preloader .pl-dot {
      width: 0.6em; height: 0.6em; border-radius: 999px;
      background: linear-gradient(135deg, var(--teal), var(--blue));
      transform: translateY(-0.05em);
      animation: plPulse 1.4s ease-in-out infinite;
    }
    #preloader .pl-bar {
      position: absolute; bottom: 0; left: 0; height: 2px;
      background: linear-gradient(90deg, var(--teal), var(--blue));
      width: 0%; animation: plProg 1.6s 0.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
    @keyframes plFade { to { opacity: 1; } }
    @keyframes plPulse { 0%, 100% { opacity: 1; transform: translateY(-0.05em) scale(1); } 50% { opacity: 0.5; transform: translateY(-0.05em) scale(0.85); } }
    @keyframes plProg { to { width: 100%; } }

    /* ─── GRAIN OVERLAY ──────────────────────── */
    .grain-overlay {
      position: fixed; inset: 0; z-index: 9997; pointer-events: none;
      opacity: 0.06; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ─── AURORA BG (subtle) ─────────────────── */
    .aurora { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .aurora::before, .aurora::after {
      content: ''; position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.4;
    }
    .aurora::before {
      width: 60vw; height: 60vw; left: -20vw; top: -20vw;
      background: radial-gradient(circle, rgba(45, 212, 191, 0.25), transparent 60%);
      animation: auroraDrift 22s ease-in-out infinite alternate;
    }
    .aurora::after {
      width: 70vw; height: 70vw; right: -25vw; bottom: -30vw;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.22), transparent 60%);
      animation: auroraDrift 28s ease-in-out -8s infinite alternate-reverse;
    }
    @keyframes auroraDrift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(8vw, 6vh) scale(1.1); }
      100% { transform: translate(-6vw, -4vh) scale(0.95); }
    }

    /* ─── SCROLL PROGRESS BAR ────────────────── */
    .scroll-prog {
      position: fixed; top: 0; left: 0; height: 2px; width: 0;
      background: linear-gradient(90deg, var(--teal), var(--blue));
      z-index: 100; transform-origin: left;
      box-shadow: 0 0 12px rgba(45, 212, 191, 0.6);
    }

    /* ─── SECTION DOTS ───────────────────────── */
    .section-dots {
      position: fixed; right: 1.5rem; top: 50%; transform: translateY(-50%);
      z-index: 40; display: none; flex-direction: column; gap: 0.85rem;
    }
    @media (min-width: 1024px) { .section-dots { display: flex; } }
    .section-dots a {
      position: relative; width: 8px; height: 8px; border-radius: 999px;
      background: rgba(148, 163, 184, 0.3); transition: all 0.3s ease;
    }
    .section-dots a::before {
      content: attr(data-label); position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500;
      color: rgba(148, 163, 184, 0.6); white-space: nowrap; letter-spacing: 0.1em; text-transform: uppercase;
      opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
      transform: translate(8px, -50%); pointer-events: none;
    }
    .section-dots a:hover { background: var(--teal); transform: scale(1.4); }
    .section-dots a:hover::before { opacity: 1; transform: translate(0, -50%); }
    .section-dots a.is-active { background: var(--teal); box-shadow: 0 0 12px var(--teal); transform: scale(1.3); }

    /* ─── CUSTOM CURSOR (desktop only) ───────── */
    .ap-cursor, .ap-cursor-dot {
      position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
      mix-blend-mode: difference; will-change: transform;
    }
    .ap-cursor {
      width: 36px; height: 36px; border: 1.5px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px; transform: translate(-50%, -50%);
      transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1), height 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease;
    }
    .ap-cursor.is-hover { width: 60px; height: 60px; border-color: var(--teal); }
    .ap-cursor-dot {
      width: 4px; height: 4px; background: #fff; border-radius: 999px;
      transform: translate(-50%, -50%);
    }
    @media (hover: none), (pointer: coarse) {
      .ap-cursor, .ap-cursor-dot { display: none; }
    }
    body.cursor-active { cursor: none; }
    body.cursor-active a, body.cursor-active button { cursor: none; }

    /* ─── REVEAL ANIMATIONS ─────────────────── */
    [data-reveal] { opacity: 0; transform: translateY(40px); will-change: opacity, transform; }
    [data-reveal-stagger] > * { opacity: 0; transform: translateY(30px); will-change: opacity, transform; }
    /* SplitText line wrapper — opt-in masking handled by `mask: 'lines'` */
    .hero-split-line { will-change: transform; }

    /* ─── REFINED HOVERS / FOCUS ─────────────── */
    a, button { transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--teal); outline-offset: 4px; border-radius: 8px;
    }

    /* ─── CARD POLISH ────────────────────────── */
    .ap-card-hover { transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, background 0.4s ease; }
    .ap-card-hover:hover { transform: translateY(-4px); }

    /* Metric card gradient sweep on hover */
    .metric-card::before {
      content: ''; position: absolute; inset: -1px; border-radius: inherit;
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.4), transparent 40%, transparent 60%, rgba(59, 130, 246, 0.3));
      opacity: 0; transition: opacity 0.5s ease; z-index: -1; pointer-events: none;
    }
    .metric-card:hover::before { opacity: 1; }

    /* ─── SLIDE FADE-IN (carousel) ───────────── */
    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateX(24px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .slide-fade-in { animation: slideFadeIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* ─── ANIMATED AUDIO WAVEFORM ────────────── */
    .wave-bar { transition: height 0.18s cubic-bezier(0.16, 1, 0.3, 1); }
    [data-wave][data-playing="1"] .wave-bar {
      animation: waveBeat 0.9s ease-in-out infinite;
    }
    [data-wave][data-playing="1"] .wave-bar:nth-child(1)  { animation-delay: 0.00s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(2)  { animation-delay: 0.10s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(3)  { animation-delay: 0.20s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(4)  { animation-delay: 0.05s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(5)  { animation-delay: 0.25s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(6)  { animation-delay: 0.15s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(7)  { animation-delay: 0.30s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(8)  { animation-delay: 0.08s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(9)  { animation-delay: 0.22s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(10) { animation-delay: 0.12s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(11) { animation-delay: 0.28s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(12) { animation-delay: 0.04s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(13) { animation-delay: 0.18s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(14) { animation-delay: 0.06s; }
    [data-wave][data-playing="1"] .wave-bar:nth-child(15) { animation-delay: 0.24s; }
    @keyframes waveBeat {
      0%, 100% { transform: scaleY(0.45); }
      50%      { transform: scaleY(1.25); }
    }
    [data-wave] .wave-bar { transform-origin: bottom; }

    /* ─── H2 UNDERLINE REVEAL ─────────────────── */
    main section h2 { position: relative; }
    main section h2[data-h2-line]::after {
      content: ''; position: absolute; left: 0; bottom: -8px; height: 2px; width: 100%;
      background: linear-gradient(90deg, var(--teal), var(--blue), transparent 70%);
      transform: scaleX(0); transform-origin: left; transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    main section h2[data-h2-line].is-in::after { transform: scaleX(1); }

    /* ─── REDUCED MOTION ─────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      .aurora::before, .aurora::after { animation: none !important; }
      [data-reveal], [data-reveal-stagger] > *, .hero-split-line { opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body class="text-slate-300 antialiased selection:bg-teal-500/30">

  <!-- Preloader -->
  <div id="preloader">
    <div class="pl-mark">AP<span class="pl-dot"></span></div>
    <div class="pl-bar"></div>
  </div>
  <script>
    // Defensive failsafe: hide preloader after 3s no matter what (in case React fails to mount).
    setTimeout(function () {
      var pl = document.getElementById('preloader');
      if (pl && !pl.classList.contains('done')) pl.classList.add('done');
    }, 3000);
    // Also catch unhandled errors and surface them instead of silently blanking.
    window.addEventListener('error', function (e) { console.error('[ap-tech] runtime error:', e.error || e.message); });
  </script>

  <!-- Ambient layers -->
  <div class="aurora" aria-hidden="true"></div>
  <div class="grain-overlay" aria-hidden="true"></div>

  <!-- Scroll progress -->
  <div class="scroll-prog" id="scrollProg" aria-hidden="true"></div>

  <!-- Section dot nav -->
  <nav class="section-dots" id="sectionDots" aria-label="Section navigation"></nav>

  <!-- Custom cursor -->
  <div class="ap-cursor" id="apCursor" aria-hidden="true"></div>
  <div class="ap-cursor-dot" id="apCursorDot" aria-hidden="true"></div>

  <!-- The React app will inject here -->
  <div id="root"></div>

  <!-- React Application Code -->
  <script type="text/babel" data-type="module">
    import React, { useState, useRef, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import gsap from 'gsap';
    import { ScrollTrigger } from 'gsap/ScrollTrigger';
    import { SplitText } from 'gsap/SplitText';
    import { ScrambleTextPlugin } from 'gsap/ScrambleTextPlugin';
    import { Observer } from 'gsap/Observer';
    import { CustomEase } from 'gsap/CustomEase';
    import Lenis from 'lenis';

    gsap.registerPlugin(ScrollTrigger, SplitText, ScrambleTextPlugin, Observer, CustomEase);
    // Brand signature ease — used across the site for consistency
    CustomEase.create('apEase', '0.16, 1, 0.3, 1');
    import { 
      Globe, Shield, Cpu, Activity, Zap, Factory, Crosshair, Layers, 
      ChevronRight, ChevronDown, BarChart3, Microscope, ShieldCheck, Map,
      Building2, Briefcase, Settings, MapPin, Users, User, Target, 
      HeartPulse, Brain, TrendingUp, GitMerge, LineChart, Calendar,
      Play, Pause, Volume2, Maximize, Gauge, ArrowRight, TrendingDown,
      Wrench, Eye, Rocket, ArrowUpRight, Lock, AlertCircle, CheckCircle2, RefreshCw,
      AlertTriangle, Scale, Merge, Lightbulb, FileCheck2, Presentation, Link as LinkIcon,
      ChevronLeft, Filter, AlertOctagon, RefreshCcw, FileDigit, Menu, Check, X
    } from 'lucide-react';

    // --- CUSTOM SVG ICONS ---
    const ArrowDown = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <polyline points="19 12 12 19 5 12"></polyline>
      </svg>
    );

    const ArrowLeft = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    );

    // --- MIND MAP DATA & CONFIGURATION ---
    const IconsMap = {
      Building2, Factory, Briefcase, Cpu, Layers, Crosshair, Settings,
      Globe, MapPin, Users, User, Target, HeartPulse, Brain, TrendingUp,
      GitMerge, Shield, LineChart, ShieldCheck, Calendar, Activity, Microscope, Zap
    };

    const mindMapData = {
      id: 'root',
      label: 'AP Technologies Group Pte. Ltd.',
      icon: 'Activity',
      children: [
        {
          id: 'identity',
          label: 'Corporate Identity',
          icon: 'Building2',
          children: [
            { label: 'Founded: 2013', icon: 'Calendar' },
            { label: 'HQ: Singapore', icon: 'MapPin' },
            { label: 'Type: MedTech CDMO', icon: 'Factory' },
            { label: 'Ownership: AGIC Capital Backed', icon: 'Briefcase' }
          ]
        },
        {
          id: 'capabilities',
          label: 'Manufacturing Capabilities',
          icon: 'Factory',
          children: [
            {
              id: 'core-tech',
              label: 'Core Technologies',
              icon: 'Cpu',
              children: [
                { label: 'Custom Extrusion', icon: 'GitMerge' },
                { label: 'PTFE Liners', icon: 'Layers' },
                { label: 'Tri-Layer Tubing', icon: 'Layers' },
                { label: 'Braid & Coil Reinforcement', icon: 'Settings' }
              ]
            },
            {
              id: 'tech-specs',
              label: 'Technical Specs',
              icon: 'Crosshair',
              children: [
                { label: 'Walls down to 0.0005"', icon: 'Crosshair' },
                { label: 'Tolerances ±0.0003"', icon: 'Crosshair' },
                { label: 'CPK 1.33 Standard', icon: 'ShieldCheck' }
              ]
            },
            {
              id: 'sec-ops',
              label: 'Secondary Operations',
              icon: 'Settings',
              children: [
                { label: 'Tip Forming & Flaring', icon: 'Settings' },
                { label: 'Laser Marking', icon: 'Zap' },
                { label: 'Hydrophilic Coating', icon: 'Settings' },
                { label: 'Assembly & Packaging', icon: 'Factory' }
              ]
            }
          ]
        },
        {
          id: 'footprint',
          label: 'Global Footprint',
          icon: 'Globe',
          children: [
            { label: 'Singapore: HQ & R&D', icon: 'MapPin' },
            { label: 'Irvine, USA: Prototyping Lab', icon: 'MapPin' },
            { label: 'Xiamen, China: High-Volume Extrusion', icon: 'MapPin' },
            { label: 'Bac Ninh, Vietnam: China+1 Hedge', icon: 'MapPin' }
          ]
        },
        {
          id: 'leadership',
          label: 'Leadership Team',
          icon: 'Users',
          children: [
            { label: 'Charles Tang: CEO & Founder', icon: 'User' },
            { label: 'Sean L. Tang: Strategy & Tech', icon: 'User' },
            { label: 'Russell Nagy: Chief Commercial Officer', icon: 'User' },
            { label: 'Till Vestring: Non-Exec Director', icon: 'User' }
          ]
        },
        {
          id: 'markets',
          label: 'Strategic Markets',
          icon: 'Target',
          children: [
            { label: 'Interventional Cardiology', icon: 'HeartPulse' },
            { label: 'Neurology', icon: 'Brain' },
            { label: 'Diabetic Care', icon: 'Activity' },
            { label: 'Diagnostics', icon: 'Microscope' }
          ]
        },
        {
          id: 'strategy',
          label: 'Business Strategy',
          icon: 'TrendingUp',
          children: [
            { label: 'Vertical Integration', icon: 'GitMerge' },
            { label: 'Geopolitical Resilience', icon: 'Shield' },
            { label: 'Cost-to-Performance Ratio', icon: 'LineChart' },
            { label: 'Regulatory Compliance (ISO 13485)', icon: 'ShieldCheck' }
          ]
        }
      ]
    };

    const nodeClasses = {
      0: 'bg-slate-900 backdrop-blur-md border-2 border-teal-500/50 text-white text-2xl p-6 rounded-2xl shadow-[0_0_40px_rgba(20,184,166,0.15)] font-extrabold min-w-[360px] flex items-center justify-between gap-4 cursor-pointer hover:border-teal-400 transition-colors',
      1: 'bg-slate-900 backdrop-blur-md border border-blue-500/40 text-blue-100 p-4 rounded-xl shadow-lg hover:border-blue-500 hover:shadow-[0_0_20px_rgba(59,130,246,0.2)] transition-all font-bold min-w-[300px] flex items-center justify-between gap-3 cursor-pointer',
      2: 'bg-slate-900/90 backdrop-blur-md border border-purple-500/40 text-purple-100 p-3 rounded-lg hover:border-purple-500 hover:shadow-[0_0_15px_rgba(168,85,247,0.2)] transition-all text-sm font-semibold min-w-[260px] flex items-center justify-between gap-3 cursor-pointer',
      3: 'bg-slate-900/80 backdrop-blur-md border border-emerald-500/30 text-emerald-100 p-2.5 px-4 rounded-md hover:border-emerald-500/60 hover:bg-slate-800 transition-all text-xs font-medium min-w-[240px] flex items-center justify-between gap-3 cursor-pointer'
    };

    const iconColors = {
      0: 'text-teal-400',
      1: 'text-blue-400',
      2: 'text-purple-400',
      3: 'text-emerald-400'
    };

    const lineColors = {
      1: 'bg-blue-500/40',
      2: 'bg-purple-500/40',
      3: 'bg-emerald-500/40'
    };

    const dotColors = {
      1: 'bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.8)]',
      2: 'bg-purple-500 shadow-[0_0_8px_rgba(168,85,247,0.8)]',
      3: 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]'
    };

    // --- RECURSIVE TREE NODE COMPONENT ---
    const TreeNode = ({ node, level = 0 }) => {
      const [isExpanded, setIsExpanded] = useState(true);
      const Icon = IconsMap[node.icon] || null;
      const hasChildren = node.children && node.children.length > 0;

      return (
        <div className="flex items-center">
          <div className={`relative z-10 ${nodeClasses[Math.min(level, 3)]}`} onClick={() => hasChildren && setIsExpanded(!isExpanded)}>
            <div className="flex items-center gap-3">
              {Icon && (
                <Icon 
                  strokeWidth={level === 0 ? 2.5 : 2} 
                  className={`flex-shrink-0 ${level === 0 ? 'w-8 h-8' : level === 1 ? 'w-5 h-5' : 'w-4 h-4'} ${iconColors[Math.min(level, 3)]}`} 
                />
              )}
              <span>{node.label}</span>
            </div>
            {hasChildren && (
              <div className="ml-4 opacity-60 flex-shrink-0">
                {isExpanded ? <ChevronDown className="w-4 h-4" /> : <ChevronRight className="w-4 h-4" />}

          </div>

          {hasChildren && isExpanded && (
            <div className="flex items-stretch">
              <div className="flex items-center">
                <div className={`w-10 h-[2px] ${lineColors[level + 1] || 'bg-slate-700/80'}`}></div>
              </div>
              <div className="flex flex-col justify-center py-2">
                {node.children.map((child, index) => {
                  const isFirst = index === 0;
                  const isLast = index === node.children.length - 1;
                  const isOnly = node.children.length === 1;

                  return (
                    <div key={child.id || child.label} className="flex items-center relative my-2.5">
                      {!isOnly && (
                        <div className={`absolute left-0 w-[2px] ${lineColors[level + 1] || 'bg-slate-700/80'}
                          ${isFirst ? 'top-1/2 bottom-0' : ''}
                          ${isLast ? 'top-0 bottom-1/2' : ''}
                          ${!isFirst && !isLast ? 'top-0 bottom-0' : ''}

                      )}
                      <div className="flex items-center">
                        <div className={`w-10 h-[2px] ${lineColors[level + 1] || 'bg-slate-700/80'}`}></div>
                        <div className={`w-2.5 h-2.5 rounded-full ${dotColors[level + 1] || 'bg-slate-500'} -ml-[5px] mr-3 z-10`}></div>

    // --- SECTION DIVIDER COMPONENT ---
    const SectionDivider = () => (
      <div className="relative my-32 flex items-center justify-center">
        <div className="absolute inset-x-0 top-1/2 h-px bg-gradient-to-r from-transparent via-slate-800 to-transparent"></div>
        <div className="relative flex items-center gap-3 px-6 bg-slate-950">
          <span className="block w-1.5 h-1.5 rounded-full bg-teal-400/60"></span>
          <span className="block w-1 h-1 rounded-full bg-slate-700"></span>
          <span className="block w-1 h-1 rounded-full bg-slate-700"></span>
        </div>
      </div>
    );

    // --- MAIN PORTAL COMPONENT ---
    function APTechnologiesPortal() {
      const [isPlaying, setIsPlaying] = useState(false);
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const audioRef = useRef(null);
      
      // Carousel State
      const [currentSlide, setCurrentSlide] = useState(1);
      const totalSlides = 13;

      // ─── PREMIUM ANIMATION LAYER ───────────────────────────────
      useEffect(() => {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

        // 1) Lenis smooth scroll + GSAP ticker integration
        const lenis = new Lenis({ lerp: 0.1, duration: 1.15, smoothWheel: true });
        lenis.on('scroll', ScrollTrigger.update);
        const raf = (time) => lenis.raf(time * 1000);
        gsap.ticker.add(raf);
        gsap.ticker.lagSmoothing(0);

        // 2) Hide preloader after first paint
        const pl = document.getElementById('preloader');
        const hidePreloader = () => { pl && pl.classList.add('done'); };
        const plTimer = setTimeout(hidePreloader, 1400);

        // 3) Custom cursor (desktop only)
        const cursor = document.getElementById('apCursor');
        const cursorDot = document.getElementById('apCursorDot');
        let cursorMove, cursorEnter, cursorLeave, hoverEls = [];
        if (isDesktop && cursor && cursorDot) {
          document.body.classList.add('cursor-active');
          const pos = { x: window.innerWidth / 2, y: window.innerHeight / 2, cx: 0, cy: 0, dx: 0, dy: 0 };
          cursorMove = (e) => { pos.x = e.clientX; pos.y = e.clientY; };
          window.addEventListener('mousemove', cursorMove);
          gsap.ticker.add(() => {
            pos.cx += (pos.x - pos.cx) * 0.18;
            pos.cy += (pos.y - pos.cy) * 0.18;
            pos.dx += (pos.x - pos.dx) * 0.45;
            pos.dy += (pos.y - pos.dy) * 0.45;
            cursor.style.transform = `translate(${pos.cx}px, ${pos.cy}px) translate(-50%, -50%)`;
            cursorDot.style.transform = `translate(${pos.dx}px, ${pos.dy}px) translate(-50%, -50%)`;
          });
          // Magnetic hover targets
          hoverEls = Array.from(document.querySelectorAll('a, button, [data-magnetic]'));
          cursorEnter = () => cursor.classList.add('is-hover');
          cursorLeave = () => cursor.classList.remove('is-hover');
          hoverEls.forEach(el => {
            el.addEventListener('mouseenter', cursorEnter);
            el.addEventListener('mouseleave', cursorLeave);
          });
        }

        // 4) Scroll progress bar
        const prog = document.getElementById('scrollProg');
        const progST = ScrollTrigger.create({
          start: 0, end: 'max',
          onUpdate: (self) => { if (prog) prog.style.width = (self.progress * 100) + '%'; },
        });

        // 5) Section dot nav
        // NOTE: `Map` is shadowed by lucide-react's Map icon import — use plain object.
        const dotNav = document.getElementById('sectionDots');
        const sections = Array.from(document.querySelectorAll('main section[id]'));
        const dotMap = Object.create(null);
        if (dotNav) {
          dotNav.innerHTML = '';
          sections.forEach((s) => {
            const a = document.createElement('a');
            a.href = '#' + s.id;
            a.setAttribute('data-label', s.id.replace('-', ' '));
            a.addEventListener('click', (e) => { e.preventDefault(); lenis.scrollTo('#' + s.id, { offset: -80 }); });
            dotNav.appendChild(a);
            dotMap[s.id] = a;
          });
        }
        const dotTriggers = sections.map(s => ScrollTrigger.create({
          trigger: s, start: 'top 40%', end: 'bottom 40%',
          onToggle: (self) => {
            const a = dotMap[s.id];
            if (a) a.classList.toggle('is-active', self.isActive);
          },
        }));

        // 6) Hero entrance choreography (SplitText per-line mask reveal)
        let heroSplit = null;
        if (!reduced) {
          const heroTitle = document.querySelector('[data-anim="hero-title"]');
          if (heroTitle) {
            // Wait for fonts before splitting to avoid line-break shifts
            const splitNow = () => {
              heroSplit = SplitText.create(heroTitle, {
                type: 'lines, words',
                mask: 'lines',
                linesClass: 'hero-split-line',
              });
              const tl = gsap.timeline({ defaults: { ease: 'apEase' } });
              tl.from('[data-anim="hero-badge"]', { y: 20, opacity: 0, duration: 0.8 })
                .from(heroSplit.lines, { yPercent: 110, duration: 1.1, stagger: 0.09 }, '-=0.4')
                .from('[data-anim="hero-sub"]', { y: 20, opacity: 0, duration: 0.9 }, '-=0.6')
                .from('[data-anim="hero-chip"]', { y: 16, opacity: 0, duration: 0.6, stagger: 0.08 }, '-=0.5');
            };
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.then(splitNow);
            } else {
              splitNow();
            }
          }
          // Hero blob parallax
          const heroBlob = document.querySelector('[data-anim="hero-blob"]');
          if (heroBlob) {
            gsap.to(heroBlob, {
              yPercent: 25, xPercent: -15, scale: 1.15, ease: 'none',
              scrollTrigger: { trigger: heroBlob, start: 'top top', end: '+=100%', scrub: 1 },
            });
          }
        }

        // 7) Auto-tag and reveal everything
        // Mark every section's primary children + every key card group
        const revealSelectors = [
          'main section h2', 'main section h3', 'main section > div',
          'main section .grid > *', 'main section [class*="rounded-2xl"]',
          'main section [class*="rounded-3xl"]'
        ];
        const seen = new WeakSet();
        const revealEls = [];
        revealSelectors.forEach(sel => {
          document.querySelectorAll(sel).forEach(el => {
            if (seen.has(el)) return;
            // skip elements inside the hero (already animated)
            if (el.closest('#overview > div:first-child')) return;
            // skip the ecosystem inner scroller content
            if (el.closest('#ecosystem .overflow-auto')) return;
            seen.add(el);
            revealEls.push(el);
          });
        });
        const revealTriggers = revealEls.map(el => {
          gsap.set(el, { opacity: 0, y: 40 });
          return ScrollTrigger.create({
            trigger: el, start: 'top 88%', once: true,
            onEnter: () => gsap.to(el, { opacity: 1, y: 0, duration: 0.9, ease: 'expo.out' }),
          });
        });

        // 8) Magnetic effect on key buttons
        const magnets = document.querySelectorAll('[data-magnetic]');
        const magnetCleanups = [];
        if (isDesktop && !reduced) {
          magnets.forEach(el => {
            const onMove = (e) => {
              const r = el.getBoundingClientRect();
              const mx = e.clientX - r.left - r.width / 2;
              const my = e.clientY - r.top - r.height / 2;
              gsap.to(el, { x: mx * 0.25, y: my * 0.25, duration: 0.5, ease: 'power3.out' });
            };
            const onLeave = () => gsap.to(el, { x: 0, y: 0, duration: 0.6, ease: 'elastic.out(1, 0.4)' });
            el.addEventListener('mousemove', onMove);
            el.addEventListener('mouseleave', onLeave);
            magnetCleanups.push(() => {
              el.removeEventListener('mousemove', onMove);
              el.removeEventListener('mouseleave', onLeave);
            });
          });
        }

        // 9a) Metric numbers — scramble through digits and land on the value
        const counters = document.querySelectorAll('[data-counter]');
        const counterTriggers = [];
        counters.forEach(el => {
          const target = parseFloat(el.dataset.target || '0');
          const decimals = parseInt(el.dataset.decimals || '0', 10);
          const prefix = el.dataset.prefix || '';
          const suffix = el.dataset.suffix || '';
          const finalText = prefix + target.toFixed(decimals) + suffix;
          const tw = gsap.to(el, {
            duration: 1.6, ease: 'apEase', paused: true,
            scrambleText: { text: finalText, chars: '0123456789', revealDelay: 0.2, speed: 0.7, tweenLength: false },
          });
          counterTriggers.push(ScrollTrigger.create({
            trigger: el, start: 'top 90%', once: true, onEnter: () => tw.play(),
          }));
        });

        // 9b) H2 underline reveal — auto-tag every <main section h2>
        const h2s = document.querySelectorAll('main section h2');
        const h2Triggers = [];
        h2s.forEach(h => {
          h.setAttribute('data-h2-line', '');
          h2Triggers.push(ScrollTrigger.create({
            trigger: h, start: 'top 85%', once: true,
            onEnter: () => h.classList.add('is-in'),
          }));
        });

        // 9c) Carousel: swipe (touch) + keyboard arrow navigation
        const deck = document.getElementById('pitch-deck');
        const prevBtn = () => document.querySelector('[data-slide-prev]');
        const nextBtn = () => document.querySelector('[data-slide-next]');
        const clickPrev = () => { const b = prevBtn(); if (b && !b.disabled) b.click(); };
        const clickNext = () => { const b = nextBtn(); if (b && !b.disabled) b.click(); };
        let deckObs = null;
        if (deck) {
          deckObs = Observer.create({
            target: deck,
            type: 'touch', // wheel is owned by Lenis; keep touch only to avoid scroll conflicts
            tolerance: 60,
            onLeft:  clickNext,
            onRight: clickPrev,
          });
        }
        const onKey = (e) => {
          if (!deck) return;
          const r = deck.getBoundingClientRect();
          const inView = r.top < window.innerHeight * 0.9 && r.bottom > 0;
          if (!inView) return;
          if (e.key === 'ArrowRight') { e.preventDefault(); clickNext(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); clickPrev(); }
        };
        window.addEventListener('keydown', onKey);

        // 10) Hijack in-page anchor clicks → Lenis (so dropdown nav animates smoothly too)
        const anchorHandler = (e) => {
          const a = e.target.closest('a[href^="#"]');
          if (!a) return;
          const id = a.getAttribute('href');
          if (!id || id === '#') return;
          const target = document.querySelector(id);
          if (!target) return;
          e.preventDefault();
          lenis.scrollTo(target, { offset: -80, duration: 1.4 });
        };
        document.addEventListener('click', anchorHandler);

        // Refresh after layout settles (images, fonts)
        const refreshT = setTimeout(() => ScrollTrigger.refresh(), 300);
        window.addEventListener('load', () => ScrollTrigger.refresh());

        return () => {
          clearTimeout(plTimer); clearTimeout(refreshT);
          gsap.ticker.remove(raf);
          lenis.destroy();
          progST && progST.kill();
          dotTriggers.forEach(t => t.kill());
          revealTriggers.forEach(t => t.kill());
          counterTriggers.forEach(t => t.kill());
          h2Triggers.forEach(t => t.kill());
          deckObs && deckObs.kill();
          heroSplit && heroSplit.revert();
          window.removeEventListener('keydown', onKey);
          magnetCleanups.forEach(fn => fn());
          if (cursorMove) window.removeEventListener('mousemove', cursorMove);
          if (cursorEnter) hoverEls.forEach(el => {
            el.removeEventListener('mouseenter', cursorEnter);
            el.removeEventListener('mouseleave', cursorLeave);
          });
          document.removeEventListener('click', anchorHandler);
          document.body.classList.remove('cursor-active');
        };
      }, []);

      const toggleAudio = () => {
        if (audioRef.current) {
          if (isPlaying) {
            audioRef.current.pause();
          } else {
            audioRef.current.play();
          }
        }
      };

      const nextSlide = () => setCurrentSlide(prev => Math.min(prev + 1, totalSlides));
      const prevSlide = () => setCurrentSlide(prev => Math.max(prev - 1, 1));

      // Navigation Links
      const navLinks = [
        { id: 'overview', label: 'Executive Summary' },
        { id: 'pitch-deck', label: 'Presentation Deck' },
        { id: 'infographic', label: 'Precision Matrix' },
        { id: 'capabilities', label: 'Engineering' },
        { id: 'footprint', label: 'Global Footprint' },
        { id: 'strategy', label: 'AI Strategy' },
        { id: 'briefing', label: 'Board Briefing' },
        { id: 'ecosystem', label: 'Ecosystem Map' }
      ];

      return (
        <div className="pb-24">
          {/* Navigation (Sticky Header Menu with Dropdown) */}
          <nav className="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 shadow-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                <div className="flex items-center space-x-2">
                  <Activity className="h-6 w-6 text-teal-400" />
                  <span className="logo-text text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-blue-500 tracking-wider">GoodAI</span>
                  <span className="text-xs font-semibold text-slate-500 uppercase tracking-widest border-l border-slate-700 pl-2 ml-1">AP Tech</span>
                </div>
                
                {/* Dropdown Menu Toggle */}
                <div className="relative">
                  <button 
                    onClick={() => setIsMenuOpen(!isMenuOpen)}
                    className="flex items-center space-x-2 px-4 py-2 bg-slate-800/80 hover:bg-slate-700 text-white rounded-lg transition-colors border border-slate-700"
                  >
                    <Menu className="w-4 h-4" />
                    <span className="text-sm font-semibold uppercase tracking-wider hidden sm:block">Navigate</span>
                    <ChevronDown className={`w-4 h-4 transition-transform duration-200 ${isMenuOpen ? 'rotate-180' : ''}`} />
                  </button>
                  
                  {/* Dropdown Content */}
                  {isMenuOpen && (
                    <>
                      <div className="fixed inset-0 z-40" onClick={() => setIsMenuOpen(false)}></div>
                      <div className="absolute right-0 mt-3 w-64 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-2 z-50">
                        {navLinks.map((link, i) => (
                          <a
                            key={link.id}
                            href={`#${link.id}`}
                            onClick={() => setIsMenuOpen(false)}
                            className="group flex items-center justify-between px-5 py-3 text-sm text-slate-300 hover:text-teal-400 hover:bg-slate-800/50 transition-colors font-medium"
                          >
                            <span className="flex items-center gap-3">
                              <span className="font-mono text-[10px] text-slate-600 group-hover:text-teal-500/70 transition-colors">{String(i + 1).padStart(2, '0')}</span>
                              {link.label}
                            </span>
                            <ArrowUpRight className="w-3.5 h-3.5 opacity-0 -translate-x-1 group-hover:opacity-100 group-hover:translate-x-0 transition-all" />
                          </a>
                        ))}
                      </div>
                    </>
                  )}
                </div>

              </div>
            </div>
          </nav>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12">
            
            {/* =========================================
                SECTION 1: OVERVIEW & MEDIA
            ========================================= */}
            <section id="overview" className="space-y-12 pt-8 scroll-mt-24">
              {/* Hero */}
              <div className="relative rounded-3xl overflow-hidden bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 p-8 md:p-16">
                <div data-anim="hero-blob" className="absolute top-0 right-0 -mt-20 -mr-20 w-96 h-96 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div className="relative z-10 max-w-3xl">
                  <div data-anim="hero-badge" className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-teal-500/10 border border-teal-500/20 text-teal-400 text-xs font-semibold uppercase tracking-widest mb-6">
                    <ShieldCheck className="w-4 h-4" />
                    <span>Tier-1 MedTech CDMO</span>
                  </div>
                  <h1 data-anim="hero-title" className="text-5xl md:text-7xl font-extrabold text-white tracking-tight mb-6 leading-[1.05]" style={{ fontKerning: 'none', textRendering: 'optimizeSpeed' }}>
                    Precision Medical Manufacturing at <span className="text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-blue-500">Global Scale.</span>
                  </h1>
                  <p data-anim="hero-sub" className="text-xl text-slate-400 mb-8 leading-relaxed max-w-2xl">
                    Transitioning from a boutique extruder to a vertically integrated, multi-continent platform. Derisking the global supply chain for Class II & III medical devices.
                  </p>
                  <div className="flex flex-wrap gap-4">
                    <div data-anim="hero-chip" className="flex items-center space-x-2 text-sm text-slate-300 bg-slate-800/50 px-4 py-2 rounded-lg border border-slate-700">
                      <Crosshair className="w-4 h-4 text-teal-400" />

                    </div>
                    <div data-anim="hero-chip" className="flex items-center space-x-2 text-sm text-slate-300 bg-slate-800/50 px-4 py-2 rounded-lg border border-slate-700">
                      <Globe className="w-4 h-4 text-blue-400" />

                    </div>
                    <div data-anim="hero-chip" className="flex items-center space-x-2 text-sm text-slate-300 bg-slate-800/50 px-4 py-2 rounded-lg border border-slate-700">
                      <BarChart3 className="w-4 h-4 text-purple-400" />

              </div>

              {/* Quick Metrics */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                {[

                  { label: 'Cleanroom Space', value: '110k+', target: 110, decimals: 0, prefix: '', suffix: 'k+', sub: 'Sq. Ft. (ISO Class 7 & 8)' },

                ].map((metric, i) => (

                    <div className="text-slate-500 text-[11px] font-mono font-medium mb-3 uppercase tracking-[0.15em]">{metric.label}</div>

                ))}

              {/* MEDIA & BRIEFINGS SECTION */}
              <div className="mt-16">
                <div className="flex items-center justify-between mb-8">

                </div>

                    <div className="bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 rounded-3xl p-8 relative overflow-hidden h-full flex flex-col justify-center">
                      <div className="absolute -top-12 -right-12 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
                      <div className="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-slate-950 to-transparent pointer-events-none z-0"></div>

                      <div className="relative z-10">
                        <div className="flex items-center space-x-2 mb-8">

                        <h3 className="text-2xl font-bold text-white mb-2">AGIC Capital Thesis</h3>

                          <audio

                            onPlay={() => setIsPlaying(true)}
                            className="hidden"
                          />
                          <button
                            onClick={toggleAudio}
                            data-magnetic
                            className="w-14 h-14 rounded-full bg-gradient-to-r from-teal-500 to-blue-500 flex items-center justify-center flex-shrink-0 hover:scale-105 transition-transform shadow-[0_0_30px_rgba(59,130,246,0.45)]"
                          >
                            {isPlaying ? (
                              <Pause className="w-6 h-6 text-white" fill="currentColor" />
                            ) : (
                              <Play className="w-6 h-6 text-white ml-1" fill="currentColor" />
                            )}
                          </button>
                          
                          <div className="flex-1">
                            {/* Audio Waveform */}
